name: Continuous Integration
run-name: ${{ startsWith(github.ref, 'refs/tags/') && 'Main → Prod' || (github.ref == 'refs/heads/main' && 'Main → Staging' || 'Feature → Dev') }} (${{ github.ref_name }})

on:
  push:

permissions:
  contents: read  # Grants workflow permission to read repository contents
  packages: write  # Allows workflow to create and modify container registry packages
  id-token: write  # Enables OIDC token generation for secure communication purposes
  checks: write  # Allows workflow to create, update, and finalize GitHub checks
  actions: read  # Verify successful main workflow for releases

concurrency:
  group: ci-${{ startsWith(github.ref, 'refs/tags/') && 'P' || (github.ref == 'refs/heads/main' && 'Q' || 'D') }}
  cancel-in-progress: false


jobs:
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      e2e: ${{ steps.detect.outputs.e2e }}
      release: ${{ steps.detect.outputs.release }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Changes
        id: detect
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          # ----------------------------------------
          # Release
          # ----------------------------------------

          if [[ "$REF" == refs/tags/* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "backend=false" >> "$GITHUB_OUTPUT"
            echo "e2e=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "release=false" >> "$GITHUB_OUTPUT"

          BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          BRANCH="${GITHUB_REF_NAME//\//-}"

          FRONTEND_IMAGE="$BASE/frontend:branch-$BRANCH"
          BACKEND_IMAGE="$BASE/backend:branch-$BRANCH"

          # ----------------------------------------
          # Letzten erfolgreichen CI-Stand ermitteln
          # ----------------------------------------

          MARKER="$BASE/ci-state:branch-$BRANCH"

          get_revision() {
            local image="$1"

            docker pull "$image" >/dev/null 2>&1 || return 1

            docker image inspect "$image" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          }

          LAST_SUCCESS=$(get_revision "$MARKER" || true)

          if [[ -n "$LAST_SUCCESS" &&
                "$LAST_SUCCESS" != "<no value>" ]] &&
             git cat-file -e "${LAST_SUCCESS}^{commit}" 2>/dev/null &&
             git merge-base --is-ancestor "$LAST_SUCCESS" HEAD; then

            echo "Last successful CI commit: $LAST_SUCCESS"

          else
            echo "No valid successful CI reference found."
            LAST_SUCCESS=""
          fi


          # ----------------------------------------
          # Image-Revisions ermitteln
          # ----------------------------------------

          get_revision() {
            local image="$1"

            docker pull "$image" >/dev/null 2>&1 || return 1

            docker image inspect "$image" \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}'
          }

          FRONTEND_REVISION=$(get_revision "$FRONTEND_IMAGE" || true)
          BACKEND_REVISION=$(get_revision "$BACKEND_IMAGE" || true)

          FRONTEND=true
          BACKEND=true
          E2E=false

          # ----------------------------------------
          # Frontend-Änderungen
          # ----------------------------------------

          if [[ -n "$FRONTEND_REVISION" &&
                "$FRONTEND_REVISION" != "<no value>" ]] &&
             git cat-file -e "${FRONTEND_REVISION}^{commit}" 2>/dev/null; then

            if git diff --quiet "$FRONTEND_REVISION" HEAD -- \
              solawi-bid-frontend \
              solawi-bid-api-data \
              evoleq \
              buildSrc \
              gradle \
              build.gradle.kts \
              settings.gradle.kts \
              gradle.properties \
              gradlew \
              gradlew.bat \
              kotlin-js-store \
              infrastructure/docker/Dockerfile-Frontend \
              .dockerignore; then

              FRONTEND=false
            fi
          fi

          # ----------------------------------------
          # Backend-Änderungen
          # ----------------------------------------

          if [[ -n "$BACKEND_REVISION" &&
                "$BACKEND_REVISION" != "<no value>" ]] &&
             git cat-file -e "${BACKEND_REVISION}^{commit}" 2>/dev/null; then

            if git diff --quiet "$BACKEND_REVISION" HEAD -- \
              solawi-bid-backend \
              solawi-bid-database \
              solawi-bid-api-data \
              evoleq \
              buildSrc \
              gradle \
              build.gradle.kts \
              settings.gradle.kts \
              gradle.properties \
              gradlew \
              gradlew.bat \
              kotlin-js-store \
              infrastructure/docker/Dockerfile-Backend \
              .dockerignore; then

              BACKEND=false
            fi
          fi

          # ----------------------------------------
          # Änderungen an Tests und Infrastruktur
          # ----------------------------------------

          if [[ -z "$LAST_SUCCESS" ]]; then

            # Kein gültiger letzter CI-Stand vorhanden
            FRONTEND=true
            BACKEND=true
            E2E=true

          elif ! git diff --quiet "$LAST_SUCCESS" HEAD -- \
            e2e \
            docker-compose.e2e.yml \
            docker-compose.e2e.local.yml \
            infrastructure/database \
            infrastructure/docker/Dockerfile-E2E-Runner \
            infrastructure/ansible \
            infrastructure/apache \
            infrastructure/nginx \
            docker-compose.yml \
            .github/actions \
            .github/workflows; then

            E2E=true

          fi

          # ----------------------------------------
          # Builds erfordern E2E-Tests
          # ----------------------------------------

          if [[ "$FRONTEND" == true ||
                "$BACKEND" == true ]]; then
            E2E=true
          fi

          # ----------------------------------------
          # Outputs
          # ----------------------------------------

          echo "frontend=$FRONTEND" >> "$GITHUB_OUTPUT"
          echo "backend=$BACKEND" >> "$GITHUB_OUTPUT"
          echo "e2e=$E2E" >> "$GITHUB_OUTPUT"

          echo ""
          echo "================================"
          echo "Change Detection Results"
          echo "================================"
          echo "Frontend revision: $FRONTEND_REVISION"
          echo "Backend revision:  $BACKEND_REVISION"
          echo "Frontend build:    $FRONTEND"
          echo "Backend build:     $BACKEND"
          echo "Run E2E:           $E2E"
          echo "Release:           false"
          echo "================================"

  resolve-images:
    name: Resolve reusable images
    needs: detect-changes
    runs-on: ubuntu-latest

    outputs:
      frontend_build: ${{ steps.resolve.outputs.frontend_build }}
      backend_build: ${{ steps.resolve.outputs.backend_build }}
      frontend_image: ${{ steps.resolve.outputs.frontend_image }}
      backend_image: ${{ steps.resolve.outputs.backend_image }}

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve images
        id: resolve
        shell: bash
        env:
          FE_CHANGED: ${{ needs.detect-changes.outputs.frontend }}
          BE_CHANGED: ${{ needs.detect-changes.outputs.backend }}
        run: |
          set -euo pipefail

          BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          BRANCH="${GITHUB_REF_NAME//\//-}"

          for component in frontend backend; do
            IMAGE="$BASE/$component:branch-$BRANCH"

            if [[ "$component" == frontend ]]; then
              CHANGED="$FE_CHANGED"
            else
              CHANGED="$BE_CHANGED"
            fi

            if [[ "$CHANGED" == true ]]; then
              BUILD=true
            elif docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
              BUILD=false
            else
              BUILD=true
            fi

            echo "${component}_build=$BUILD" >> "$GITHUB_OUTPUT"
            echo "${component}_image=$IMAGE" >> "$GITHUB_OUTPUT"

            echo "$component: build=$BUILD, image=$IMAGE"
          done
  build-Frontend:
    needs: resolve-images
    if: needs.resolve-images.outputs.frontend_build == 'true'
    name: Build Frontend Docker Image
    runs-on: ubuntu-latest
    outputs:
      full_image_name: ${{ steps.build-frontend.outputs.full_image_name }}
      full_image_reference: ${{ steps.build-frontend.outputs.full_image_reference }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Frontend Docker Image
        id: build-frontend
        uses: ./.github/actions/build-docker
        with:
          image_name: frontend
          dockerfile_path: infrastructure/docker/Dockerfile-Frontend

  build-Backend:
    needs: resolve-images
    if: needs.resolve-images.outputs.backend_build == 'true'
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    outputs:
      full_image_name: ${{ steps.build-backend.outputs.full_image_name }}
      full_image_reference: ${{ steps.build-backend.outputs.full_image_reference }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Backend Docker Image
        id: build-backend
        uses: ./.github/actions/build-docker
        with:
          image_name: backend
          dockerfile_path: infrastructure/docker/Dockerfile-Backend

  check-e2e-runner-changes:
    needs: detect-changes
    if: needs.detect-changes.outputs.e2e == 'true'
    name: Check E2E Runner Changes
    runs-on: ubuntu-latest

    outputs:
      needs-rebuild: ${{ steps.check.outputs.needs-rebuild }}
      existing-image: ${{ steps.check.outputs.existing-image }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check E2E Runner image
        id: check
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/e2e-runner"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          BRANCH_IMAGE="${IMAGE}:${BRANCH}"
          LATEST_IMAGE="${IMAGE}:latest"

          # Prüfen, ob das Dockerfile geändert wurde
          if git diff --name-only HEAD~1 HEAD 2>/dev/null \
            | grep -Eq '^(infrastructure/docker/Dockerfile-E2E-Runner|gradle/libs\.versions\.toml)$'; then

            echo "needs-rebuild=true" >> "$GITHUB_OUTPUT"
            echo "existing-image=$BRANCH_IMAGE" >> "$GITHUB_OUTPUT"
            echo "Dockerfile changed - rebuilding runner"

          elif docker manifest inspect "$BRANCH_IMAGE" > /dev/null 2>&1; then

            echo "needs-rebuild=false" >> "$GITHUB_OUTPUT"
            echo "existing-image=$BRANCH_IMAGE" >> "$GITHUB_OUTPUT"
            echo "Using existing branch image: $BRANCH_IMAGE"

          elif docker manifest inspect "$LATEST_IMAGE" > /dev/null 2>&1; then

            echo "needs-rebuild=false" >> "$GITHUB_OUTPUT"
            echo "existing-image=$LATEST_IMAGE" >> "$GITHUB_OUTPUT"
            echo "Using existing latest image: $LATEST_IMAGE"

          else

            echo "needs-rebuild=true" >> "$GITHUB_OUTPUT"
            echo "existing-image=$BRANCH_IMAGE" >> "$GITHUB_OUTPUT"
            echo "No existing image - rebuilding runner"

          fi

  build-e2e-runner:
    name: Build E2E Runner Image
    uses: ./.github/workflows/build-e2e-runner-image.yml
    with:
      runNecessary: ${{ needs.check-e2e-runner-changes.outputs.needs-rebuild == 'true' }}
    needs: check-e2e-runner-changes
    secrets: inherit

  e2e:
    env:
      TEST_USER: ${{ vars.TEST_USER }}
      TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
      PARALLEL_TESTS: ${{ vars.PARALLEL_E2E_TESTS }}
      NUMBER_OF_WORKERS: ${{ vars.NUMBER_OF_E2E_WORKERS }}
    name: Run E2E Tests
    runs-on: ubuntu-latest # [self-hosted, Linux, X64, solyton]

    needs: [detect-changes, resolve-images, build-Frontend, build-Backend, check-e2e-runner-changes, build-e2e-runner]
    if: >-
      ${{ always() && !cancelled() &&
      needs.detect-changes.outputs.e2e == 'true' &&
      needs.build-e2e-runner.result == 'success' &&
      (needs.build-Frontend.result == 'success' || needs.build-Frontend.result == 'skipped') &&
      (needs.build-Backend.result == 'success' || needs.build-Backend.result == 'skipped') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download freshly built frontend image
        if: needs.build-Frontend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: docker-image-frontend
          path: /tmp/ci-frontend

      - name: Download freshly built backend image
        if: needs.build-Backend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: docker-image-backend
          path: /tmp/ci-backend

      - name: Prepare exact images for E2E
        shell: bash
        env:
          FE_BUILT: ${{ needs.build-Frontend.result }}
          BE_BUILT: ${{ needs.build-Backend.result }}
          FE_REF: ${{ needs.build-Frontend.outputs.full_image_reference }}
          BE_REF: ${{ needs.build-Backend.outputs.full_image_reference }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          FE="ghcr.io/${GITHUB_REPOSITORY,,}/frontend:ci-${SHORT_SHA}"
          BE="ghcr.io/${GITHUB_REPOSITORY,,}/backend:ci-${SHORT_SHA}"
          if [[ "$FE_BUILT" == success ]]; then
            docker load -i /tmp/ci-frontend/docker_image_frontend.tar
            docker tag "$FE_REF" "$FE"
          else
            docker pull "${{ needs.resolve-images.outputs.frontend_image }}"
            docker tag "${{ needs.resolve-images.outputs.frontend_image }}" "$FE"
          fi
          if [[ "$BE_BUILT" == success ]]; then
            docker load -i /tmp/ci-backend/docker_image_backend.tar
            docker tag "$BE_REF" "$BE"
          else
            docker pull "${{ needs.resolve-images.outputs.backend_image }}"
            docker tag "${{ needs.resolve-images.outputs.backend_image }}" "$BE"
          fi
          echo "FRONTEND_IMAGE=$FE" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=$BE" >> "$GITHUB_ENV"

      # Services auf Runner starten (ohne E2E Container!)
      - name: Start E2E Test Environment
        run: |
          chmod 644 ./infrastructure/database/setup.sql
          docker compose -f docker-compose.e2e.yml up -d --wait --quiet-pull

      - name: Debug E2E Environment
        shell: bash
        run: |
          echo "=== Images ==="
          echo "Frontend: $FRONTEND_IMAGE"
          echo "Backend:  $BACKEND_IMAGE"
          
          echo "=== Containers ==="
          docker compose -f docker-compose.e2e.yml ps
          
          echo "=== Frontend response ==="
          curl -v http://localhost:3000/login || true
          
          echo "=== Container logs ==="
          docker compose -f docker-compose.e2e.yml logs --tail=100

      # Dump logs on failure
      - name: Dump container logs on failure
        if: failure()
        run: |
          docker ps -a
          docker compose -f docker-compose.e2e.yml logs --no-color

      - name: Select E2E Runner image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.build-e2e-runner.outputs.image-digest }}
          EXISTING_IMAGE: ${{ needs.check-e2e-runner-changes.outputs.existing-image }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/e2e-runner"

          if [[ -n "$IMAGE_DIGEST" ]]; then
            RUNNER_IMAGE="${IMAGE}@${IMAGE_DIGEST}"
          else
            RUNNER_IMAGE="$EXISTING_IMAGE"
          fi

          echo "Using E2E Runner: $RUNNER_IMAGE"
          echo "E2E_RUNNER_IMAGE=$RUNNER_IMAGE" >> "$GITHUB_ENV"

      # E2E Tests im E2E Runner Container ausführen
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/build-cache
          key: ${{ runner.os }}-gradle-e2e-${{ hashFiles('e2e/**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-e2e-
            ${{ runner.os }}-gradle-
      - name: Run Playwright E2E tests
        run: |
          docker run --rm \
            --network host \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/workspace \
            -v "${HOME}/.gradle:/root/.gradle" \
            -w /workspace \
            -e TEST_USER="${{ vars.TEST_USER }}" \
            -e TEST_USER_PASSWORD="${{ secrets.TEST_USER_PASSWORD }}" \
            -e PARALLEL_TESTS="${{ vars.PARALLEL_E2E_TESTS }}" \
            -e NUMBER_OF_WORKERS="${{vars.NUMBER_OF_E2E_WORKERS }}" \
            "$E2E_RUNNER_IMAGE" \
            bash -c "chmod +x ./gradlew && ./gradlew :e2e:test --build-cache --info"

      # Cleanup
      - name: Stop E2E Environment
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v

      # Reports
      - name: Upload JUnit XML Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-e2e
          path: e2e/build/test-results/**/*.xml
          retention-days: 7

      - name: Publish Test Report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v2
        with:
          name: E2E Tests
          path: e2e/build/test-results/**/*.xml
          reporter: java-junit
          fail-on-error: true
          fail-on-empty: false



  publish-images:
    name: Publish verified image references
    runs-on: ubuntu-latest

    needs:
      - detect-changes
      - resolve-images
      - build-Frontend
      - build-Backend
      - e2e

    if: >-
      ${{ always() && !cancelled() &&
      needs.detect-changes.result == 'success' &&
      needs.resolve-images.result == 'success' &&
      (needs.build-Frontend.result == 'success' || needs.build-Frontend.result == 'skipped') &&
      (needs.build-Backend.result == 'success' || needs.build-Backend.result == 'skipped') &&
      (needs.detect-changes.outputs.release == 'true' ||
       needs.e2e.result == 'success' ||
       (needs.detect-changes.outputs.e2e == 'false' && needs.e2e.result == 'skipped')) }}

    outputs:
      frontend: ${{ steps.publish.outputs.frontend }}
      backend: ${{ steps.publish.outputs.backend }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release is current, successfully tested main HEAD
        if: needs.detect-changes.outputs.release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch origin main

          [[ "$(git rev-parse origin/main)" == "$GITHUB_SHA" ]] || {
            echo 'Release tag must point to current main HEAD' >&2
            exit 1
          }

          RUNS=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/CI.yml/runs?head_sha=${GITHUB_SHA}&branch=main&status=success&per_page=100")

          echo "$RUNS" | jq -e --arg sha "$GITHUB_SHA" \
            '[.workflow_runs[] |
              select(.head_sha == $sha and
                     .event == "push" and
                     .conclusion == "success")
            ] | length > 0' >/dev/null || {
              echo 'No successful main CI run for release commit' >&2
              exit 1
            }

      - name: Download newly built frontend
        if: needs.build-Frontend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: docker-image-frontend
          path: /tmp/ci-frontend

      - name: Download newly built backend
        if: needs.build-Backend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: docker-image-backend
          path: /tmp/ci-backend

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish or reuse images
        id: publish
        shell: bash
        env:
          RELEASE: ${{ needs.detect-changes.outputs.release }}

          FE_BUILT: ${{ needs.build-Frontend.result }}
          BE_BUILT: ${{ needs.build-Backend.result }}

          FE_REF: ${{ needs.build-Frontend.outputs.full_image_reference }}
          BE_REF: ${{ needs.build-Backend.outputs.full_image_reference }}

          FE_NAME: ${{ needs.build-Frontend.outputs.full_image_name }}
          BE_NAME: ${{ needs.build-Backend.outputs.full_image_name }}

          FE_EXISTING: ${{ needs.resolve-images.outputs.frontend_image }}
          BE_EXISTING: ${{ needs.resolve-images.outputs.backend_image }}

        run: |
          set -euo pipefail

          SHORT_SHA="${GITHUB_SHA:0:7}"
          BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          BRANCH="${GITHUB_REF_NAME//\//-}"

          # ----------------------------------------
          # Release: bereits getestete Images verwenden
          # ----------------------------------------

          if [[ "$RELEASE" == true ]]; then

            for component in frontend backend; do

              SOURCE="$BASE/$component:sha-$SHORT_SHA"
              TARGET="$BASE/$component:tag-${GITHUB_REF_NAME}"

              docker buildx imagetools inspect "$SOURCE" >/dev/null

              docker buildx imagetools create \
                --tag "$TARGET" \
                "$SOURCE"

              echo "$component=$TARGET" >> "$GITHUB_OUTPUT"

              echo "Release: $SOURCE -> $TARGET"

            done

            exit 0
          fi

          # ----------------------------------------
          # Normaler Branch-Build
          # ----------------------------------------

          for component in frontend backend; do

            if [[ "$component" == frontend ]]; then
              RESULT="$FE_BUILT"
              REF="$FE_REF"
              NAME="$FE_NAME"
              EXISTING="$FE_EXISTING"
            else
              RESULT="$BE_BUILT"
              REF="$BE_REF"
              NAME="$BE_NAME"
              EXISTING="$BE_EXISTING"
            fi

            TARGET="$BASE/$component:sha-$SHORT_SHA"
            BRANCH_TARGET="$BASE/$component:branch-$BRANCH"

            # ----------------------------------------
            # Neu gebautes Image veröffentlichen
            # ----------------------------------------

            if [[ "$RESULT" == success ]]; then

              echo "Publishing newly built $component"

              docker load -i \
                "/tmp/ci-$component/docker_image_$component.tar"

              docker push -a "$NAME"

              docker buildx imagetools inspect "$TARGET" >/dev/null

            # ----------------------------------------
            # Vorhandenes Branch-Image wiederverwenden
            # ----------------------------------------

            else

              echo "Reusing existing $component image: $EXISTING"

              docker buildx imagetools inspect "$EXISTING" >/dev/null

              docker buildx imagetools create \
                --tag "$TARGET" \
                "$EXISTING"

            fi

            # ----------------------------------------
            # Branch-Tag aktualisieren
            # ----------------------------------------

            docker buildx imagetools create \
              --tag "$BRANCH_TARGET" \
              "$TARGET"

            echo "$component=$TARGET" >> "$GITHUB_OUTPUT"

            echo "$component published:"
            echo "  Commit: $TARGET"
            echo "  Branch: $BRANCH_TARGET"

          done

      - name: Record successful CI commit
        if: >-
          ${{ needs.detect-changes.outputs.release != 'true' &&
              (needs.e2e.result == 'success' ||
               (needs.detect-changes.outputs.e2e == 'false' &&
                needs.e2e.result == 'skipped')) }}
        shell: bash
        run: |
          set -euo pipefail

          BASE="ghcr.io/${GITHUB_REPOSITORY,,}"
          BRANCH="${GITHUB_REF_NAME//\//-}"
          MARKER="$BASE/ci-state:branch-$BRANCH"

          docker buildx build \
            --file - \
            --tag "$MARKER" \
            --push \
            --build-arg CI_SHA="$GITHUB_SHA" \
            . <<'DOCKERFILE'
          FROM scratch
          ARG CI_SHA
          LABEL org.opencontainers.image.revision="${CI_SHA}"
          DOCKERFILE

          echo "Recorded successful CI commit: $GITHUB_SHA"
  deploy:
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'Production' || (github.ref == 'refs/heads/main' && 'Staging' || 'Develop') }}
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: publish-images
    outputs:
      frontend_domain: ${{ steps.collect-env-config.outputs.frontend_domain }}
      backend_domain: ${{ steps.collect-env-config.outputs.backend_domain }}
      environment: ${{ steps.collect-env-config.outputs.environment }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine Application Version
        id: app-version
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --tags

          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            VERSION=$(git describe --tags --abbrev=0 HEAD)
          else
            BASE_COMMIT=$(git merge-base HEAD origin/main)
            VERSION=$(git describe --tags --abbrev=0 "$BASE_COMMIT")
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: collect environment config
        id: collect-env-config
        run: |
          if [[ "${{github.ref}}" == *"refs/tags/"* ]]; then
            echo 'environment=P' >> $GITHUB_OUTPUT
            echo 'frontend_domain=solyton.org' >> $GITHUB_OUTPUT
            echo 'backend_domain=api.solyton.org' >> $GITHUB_OUTPUT
            echo 'mysql_password=${{ secrets.MYSQL_PASSWORD_P }}' >> $GITHUB_OUTPUT
            echo 'jwt_secret=${{ secrets.JWT_SECRET_P }}' >> $GITHUB_OUTPUT
            echo 'application_owner_password=${{ secrets.APPLICATION_OWNER_PASSWORD_P }}' >> $GITHUB_OUTPUT
          elif [[  "${{github.ref}}" == *"refs/heads/main"* ]]; then
            echo 'environment=Q' >> $GITHUB_OUTPUT
            echo 'frontend_domain=q.solyton.org' >> $GITHUB_OUTPUT
            echo 'backend_domain=api.q.solyton.org' >> $GITHUB_OUTPUT
            echo 'mysql_password=${{ secrets.MYSQL_PASSWORD_Q }}' >> $GITHUB_OUTPUT
            echo 'jwt_secret=${{ secrets.JWT_SECRET_Q }}' >> $GITHUB_OUTPUT
            echo 'application_owner_password=${{ secrets.APPLICATION_OWNER_PASSWORD_Q }}' >> $GITHUB_OUTPUT
          else
            echo 'environment=D' >> $GITHUB_OUTPUT
            echo 'frontend_domain=d.solyton.org' >> $GITHUB_OUTPUT
            echo 'backend_domain=api.d.solyton.org' >> $GITHUB_OUTPUT
            echo 'mysql_password=${{ secrets.MYSQL_PASSWORD_D }}' >> $GITHUB_OUTPUT
            echo 'jwt_secret=${{ secrets.JWT_SECRET_D }}' >> $GITHUB_OUTPUT
            echo 'application_owner_password=${{ secrets.APPLICATION_OWNER_PASSWORD_D }}' >> $GITHUB_OUTPUT
          fi
      - name: Debug image reference
        run: |
          echo "Backend: ${{ needs.publish-images.outputs.backend }}"
          echo "Frontend: ${{ needs.publish-images.outputs.frontend }}"
      - name: Deploy Application
        uses: ./.github/actions/deploy-application
        with:
          application_version: ${{ steps.app-version.outputs.version }}
          environment: ${{ steps.collect-env-config.outputs.environment }}
          mysql_password: ${{ steps.collect-env-config.outputs.mysql_password }}
          frontend_domain: ${{ steps.collect-env-config.outputs.frontend_domain }}
          backend_domain: ${{ steps.collect-env-config.outputs.backend_domain }}
          jwt_secret: ${{ steps.collect-env-config.outputs.jwt_secret }}
          application_owner_password: ${{ steps.collect-env-config.outputs.application_owner_password }}
          backend_image_name: ${{ needs.publish-images.outputs.backend }}
          frontend_image_name: ${{ needs.publish-images.outputs.frontend }}
          application_owner_username: 'owner@solyton.org'
          server_address: '${{ vars.SERVER_ADDRESS }}'
          server_user: ${{ vars.SERVER_USER }}
          server_key: ${{ secrets.SERVER_KEY }}
          smtp_password: ${{ secrets.SMTP_PASSWORD }}
          ghcr_pat: ${{ secrets.GHCR_PAT }}
          ghcr_user: ${{ github.actor }}

  smoke-tests:
    name: Smoke Tests
    needs: [deploy, publish-images]
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Playwright browsers
        run: ./gradlew :e2e:installPlaywright

      - name: Run smoke tests
        env:
          FRONTEND_IMAGE: ${{ needs.publish-images.outputs.frontend }}
          E2E_BASE_URL: https://${{ needs.deploy.outputs.frontend_domain }}
          TEST_USER: ${{ vars.TEST_USER }}
          TEST_USER_PASSWORD: ${{ secrets[format('SMOKE_TEST_USER_PASSWORD_{0}', needs.deploy.outputs.environment)] }}
          PARALLEL_TESTS: false # ${{ vars.PARALLEL_E2E_TESTS }}
          NUMBER_OF_WORKERS: 1 # ${{ vars.NUMBER_OF_E2E_WORKERS }}
        run: |
          ./gradlew :e2e:smokeTest --no-daemon